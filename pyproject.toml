[project]
name = "orderdesk-kb"
version = "0.1.0"
description = "Offline search over the public Order Desk knowledge base."
readme = "README.md"
requires-python = ">=3.10"
# No third-party Python dependencies on purpose: stdlib sqlite3 (FTS5) only.
# The one external tool is the `defuddle` CLI, installed via npm (see README).
dependencies = []

[project.scripts]
orderdesk-kb = "orderdesk_kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orderdesk_kb"]
